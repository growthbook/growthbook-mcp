name: Rollback Cloud MCP to SHA

# Cloud-only rollback. deploy.yml pushes every commit to ECR as :git-<sha>, so
# rolling back is: register a task-def revision pinned to a known-good
# :git-<sha> and deploy it. This does not touch npm / GHCR / self-hosted
# releases.
#
# The ECR repo is immutable, so this cannot retag the target as :latest —
# and it does not need to: the service is deployed by pinned revision, not tag.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "First 7 characters of the commit SHA (the ECR :git-<sha> tag) to roll back to"
        required: true
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'growthbook/growthbook-mcp' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Render task definition pinned to git-${{ inputs.sha }}
        id: taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: prod-growthbook-mcp
          container-name: growthbook_mcp
          image: ${{ steps.login-ecr.outputs.registry }}/growthbook-mcp:git-${{ inputs.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.taskdef.outputs.task-definition }}
          service: prod-growthbook-mcp
          cluster: prod-growthbook-mcp
          wait-for-service-stability: true
