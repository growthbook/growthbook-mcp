name: CI
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 is what the Dockerfile runs in production; 24 is the current LTS,
        # which is what npm consumers of @growthbook/mcp are on.
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v5

      - name: Checkout GrowthBook skills
        uses: ./.github/actions/checkout-agent-skills

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SKILLS_SRC: ${{ github.workspace }}/skills-src

      - name: Test
        run: npm test
