name: Deploy

# Builds the MCP image, pushes it to ECR as :latest (+ :git-<sha>), and forces a
# new ECS deployment. The ECS service, cluster, ALB, and DNS are defined in the
# terraform repo (growthbook-mcp.tf); this workflow only ships new images to them.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy.yml"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
  # Manual lever: rebuild + redeploy cloud on demand. Because the build checks
  # out growthbook/skills fresh, this is how a skills-only change reaches cloud
  # (skills commits do not auto-trigger this workflow).
  workflow_dispatch:

concurrency:
  group: deploy-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'growthbook/growthbook-mcp' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # bundle-skills (run inside the Docker build) reads SKILL.md files from a
      # checkout of growthbook/skills. Vendor it into ./skills-src so it lands in
      # the Docker build context. Mirrors ci.yml.
      - name: Checkout GrowthBook skills
        uses: actions/checkout@v5
        with:
          repository: growthbook/skills
          path: skills-src

      - name: Configure AWS credentials for ECR
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare build metadata
        id: metadata
        run: echo "docker_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/growthbook-mcp:latest
            ${{ steps.login-ecr.outputs.registry }}/growthbook-mcp:git-${{ steps.metadata.outputs.docker_sha }}

      - name: Deploy to ECS
        run: aws ecs update-service --cluster prod-growthbook-mcp --service prod-growthbook-mcp --force-new-deployment --region us-east-1
